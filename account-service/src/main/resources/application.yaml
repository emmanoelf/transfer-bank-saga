spring:
  application:
    name: account-service

  datasource:
    url: jdbc:postgresql://localhost:5432/account_bank
    username: postgres
    password: postgres

  kafka:
    bootstrap-servers: localhost:29092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: >
          debit-completed:com.tbs.account.service.transfer.DebitCompleted,
          credit-completed:com.tbs.account.service.transfer.CreditCompleted

    consumer:
      group-id: account-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.tbs.account.service.transfer
        spring.json.use.type.headers: true
        spring.json.type.mapping: >
          transfer-created:com.tbs.account.service.transfer.TransferCreated,
          credit-requested:com.tbs.account.service.transfer.CreditRequested

server:
  port: 8081