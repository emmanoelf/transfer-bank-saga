spring:
  application:
    name: account-service

  datasource:
    url: jdbc:postgresql://localhost:5432/account_bank
    username: postgres
    password: postgres

  kafka:
    bootstrap-servers: localhost:29092

    consumer:
      group-id: account-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring.json.trusted.packages: com.tbs.account.service.transfer
        spring.json.value.default.type: com.tbs.account.service.transfer.TransferCreated
        spring.json.use.type.headers: false

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8081